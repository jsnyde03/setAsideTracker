# The expense breakdown is Premium. It surfaces on the dashboard as an "Expense breakdown · Premium"
# card, soft-gated on *data*: it only appears once the year has a deductible expense (a bucket cost
# or business mileage). This flow logs an entry with mileage to make the card appear, then a free
# user taps it and routes straight to the paywall (no native Alert). No native-only path here — the
# same hop is covered by expense-breakdown.spec.ts on web; this exercises it on a real simulator for
# parity. The Schedule C grouping itself is covered by the buildScheduleCSummary unit tests.
appId: com.gigtaxtracker.app
name: Expense breakdown gating (locked card → paywall)
---
# Precondition: a fresh onboarded session on the dashboard (shared no-W2 onboarding).
- runFlow: onboarding.yaml

# Log an entry with business mileage — a Line 9 (car & truck) expense, enough to surface the card.
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
- tapOn: "Gross pay"
- inputText: "4000"
# Same class as the onboarding defect: AddEntryScreen is also a ScrollView under a
# KeyboardAvoidingView (AddEntryScreen.tsx:203,234), so a tap aimed at a field the keyboard
# covers silently lands on the keyboard and the next inputText appends to the WRONG field.
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
- scrollUntilVisible:
    element:
      text: "Mileage (business miles driven)"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Mileage (business miles driven)"
- inputText: "500"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
# ⛔ 1.2.14.4: below the fold since 1.2.5 added the GPS trip toggle — see clear-all-data.yaml.
- scrollUntilVisible:
    element:
      text: "Save Entry"
    direction: DOWN
# 1.2.14.5, corrected by run 3: dismiss the keypad after the scroll, but NEVER by coordinate.
# ⛔ A coordinate is not a neutral point, it is whatever the layout puts there. "50%,15%" = y~131,
# and once the keypad closes and the form reflows that is INSIDE the Date field [20,96][382,141] --
# so the dismissal tap opened the native date picker, which covered Save Entry and turned a working
# scroll into "Element not found". Addressing a non-interactive label BY NAME cannot drift when the
# layout moves, which is the whole failure mode 1.2.5 introduced here.
- tapOn: "Measures your miles while a trip is running.*"
- takeScreenshot: .maestro/diag-before-save
- tapOn: "Save Entry"
- takeScreenshot: .maestro/diag-after-save
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

# The breakdown card is present but locked behind Premium; tapping it opens the paywall directly.
- scrollUntilVisible:
    element:
      text: "Expense breakdown.*Premium"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    text: "Expense breakdown.*Premium"
- assertVisible: "SetAside Premium"
- tapOn: "Close"

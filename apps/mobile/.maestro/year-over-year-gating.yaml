# Year-over-year insights is Premium and soft-gated on *data*: the dashboard card only appears once
# entries span 2+ distinct tax years. Seeding that second year is a native-only path — it needs the
# DateField's native date picker (the web Playwright suite uses an <input type="date"> instead), so
# this flow is the only place that exercises setting an entry's date into a prior year. Once the card
# appears, a free user tapping it routes straight to the paywall (no native Alert). The comparison
# math is covered by the computeYearOverYear unit tests.
appId: com.gigtaxtracker.app
name: Year-over-year gating (native prior-year picker → locked card → paywall)
---
# Precondition: a fresh onboarded session on the dashboard.
- runFlow: onboarding.yaml

# --- Entry 1: a current-year entry (picker left at its default of today) ---
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
- tapOn: "Gross pay"
- inputText: "5000"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
# ⛔ 1.2.14.4: below the fold since 1.2.5 added the GPS trip toggle — see clear-all-data.yaml.
- scrollUntilVisible:
    element:
      text: "Save Entry"
    direction: DOWN
# 1.2.14.5: dismiss the keypad AFTER the scroll, not only before it. Run 2 proved the ordering
# matters: run 1's hierarchy showed no keypad at this point, run 2's showed it open with Save Entry
# fully visible and unobstructed -- the scroll gesture above can land on a numeric input and
# re-focus it. The screenshot is the instrument, not a decoration: if this still fails, the next
# dump says whether the tap landed and the save was refused, or the tap never reached the button.
- tapOn:
    point: "50%,15%"
- takeScreenshot: .maestro/diag-before-save
- tapOn: "Save Entry"
- takeScreenshot: .maestro/diag-after-save
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

# --- Entry 2: drive the native date picker back one full year, then log it ---
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
# Open the inline native date picker via the Date field, then step back 12 months (one year).
- tapOn:
    text: "Date:.*"
- repeat:
    times: 12
    commands:
      - tapOn: "Previous Month"
- tapOn: "15" # a day cell that exists in every month — commits a prior-year date
- tapOn: "Gross pay"
- inputText: "3000"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
# ⛔ 1.2.14.4: below the fold since 1.2.5 added the GPS trip toggle — see clear-all-data.yaml.
- scrollUntilVisible:
    element:
      text: "Save Entry"
    direction: DOWN
# 1.2.14.5: dismiss the keypad AFTER the scroll, not only before it. Run 2 proved the ordering
# matters: run 1's hierarchy showed no keypad at this point, run 2's showed it open with Save Entry
# fully visible and unobstructed -- the scroll gesture above can land on a numeric input and
# re-focus it. The screenshot is the instrument, not a decoration: if this still fails, the next
# dump says whether the tap landed and the save was refused, or the tap never reached the button.
- tapOn:
    point: "50%,15%"
- takeScreenshot: .maestro/diag-before-save
- tapOn: "Save Entry"
- takeScreenshot: .maestro/diag-after-save
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

# The card now appears (entries span two years); tapping it opens the paywall directly.
- scrollUntilVisible:
    element:
      text: "Year-over-year insights.*Premium"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Year-over-year insights.*Premium"
- assertVisible: "SetAside Premium"
- tapOn: "Close"

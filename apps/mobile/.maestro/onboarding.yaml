# Native onboarding → dashboard smoke. The web Playwright suite covers the same logical flow, but
# this runs the actual React Native app on a simulator, exercising real native text inputs and
# navigation that react-native-web can't represent.
appId: com.gigtaxtracker.app
name: Onboarding → Dashboard
---
- launchApp:
    clearState: true
# ⛔ extendedWaitUntil, not assertVisible: run 35902276697 failed here on a hierarchy that
# SHOWS "Welcome" on screen at [20,154][382,192]. Element present + assertion failed = the app
# had not finished its first render inside the default timeout, on a runner whose speed varies
# about 4.5x between dispatches. This waits instead of guessing how slow the machine is.
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- tapOn: "Your name"
- inputText: "Maestro Tester"
- tapOn: "Single"
# ⛔ DISMISS THE KEYBOARD HERE, BEFORE REACHING FOR THE STATE FIELD. That field sits at y≈543 on
# an 874-tall screen and the keyboard covers roughly the bottom third, so while it is up a tap
# aimed at the field lands on the KEYBOARD: focus never leaves the name field and the next
# inputText appends there. Proven, not guessed — dispatch #6's hierarchy showed the name field
# holding "Maestro Tester TX", the state field empty, and a native "State required" alert.
# ⚠️ By TAP rather than `hideKeyboard`, which is the least reliable primitive in this suite: it
# took out 10 of 12 flows on run 35818419992, and when it under-delivers here it does so SILENTLY
# — the state never gets typed, Continue fails validation, and the flow reports "Your earnings is
# not visible" ten steps later. That is what read as random flakiness, at 1 run in 6.
# A tap on a non-interactive label works for either keyboard (the screen sets
# keyboardShouldPersistTaps="handled") and is what every other dismissal here already uses.
- tapOn: "Tax profile.*"
# ⛔ NO FLOW IN THIS SUITE USES `centerElement`, and the reason is in Maestro's own loop
# (Orchestra.kt): while `centerElement` is set it accepts ONLY a near-centre element for the first
# 5 iterations — `maxRetryCenterCount = 4` — and falls through to the plain visibility check on the
# 6th. A target in the last screenful CANNOT be centred, because a further DOWN swipe at scroll
# 100% moves nothing, so those 5 iterations are guaranteed to fail and the step passes only if a
# 6th fits inside the 20s timeout. Each iteration costs a view-hierarchy fetch, so whether it fits
# is a coin flip — which is why an untouched flow passed four runs and failed the fifth. Without it
# the same step succeeds on iteration 1: `visibilityPercentage` defaults to 100, so the element is
# already proven fully on screen before anything taps it.
- scrollUntilVisible:
    element:
      text: "State you primarily work in"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "e.g. CA"
- inputText: "TX"
# ⚡ FAIL AT THE MIS-TYPE, not ten steps downstream. The "Texas" chip appears only once the
# field really holds TX, so this turns a silent lost keystroke into a failure that names itself.
- assertVisible: "Texas"
# ⛔ NOT hideKeyboard. Once "TX" is in the field a NUMERIC KEYPAD is on screen, and iOS's numeric
# keypad has no Done key, so hideKeyboard fails outright -- "Couldn't hide the keyboard", which
# took out 10 of 12 flows on run 35818419992. The dump shows the pad at y=590-874 with TX already
# entered, so this is not a typing failure.
# ⚠️ WHY a number pad follows a plain-text field is NOT yet established -- the only numeric field
# on the screen is Dependents, and nothing here taps it. The workflow's hierarchy dump now reports
# which node holds focus, so the next failure answers it instead of inviting another guess.
# Tapping a non-interactive label dismisses whatever keyboard is up (the screen sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it), and it does not care
# which keyboard that turns out to be. BY NAME, never by coordinate.
- tapOn: "Tax profile.*"
# ⚠️ Onboarding is a ScrollView (OnboardingScreen.tsx:140) and its lower half is below the fold on
# a shorter device. `tapOn` does NOT scroll, so tapping blind here is what failed 12/12 flows on
# 2026-09-20 -- every one of them on this screen, most on "Continue". Scroll first, always.
- scrollUntilVisible:
    element:
      text: "I understand this app provides estimates, not tax advice"
    direction: DOWN
- waitForAnimationToEnd
# Disclaimer checkbox — matched by the Pressable's accessibilityLabel.
- tapOn: "I understand this app provides estimates, not tax advice"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Continue"
# 🔎 DIAGNOSTIC (2026-09-20). Two hypotheses produce an identical "Your earnings is not
# visible" failure, and this separates them in the log without anyone downloading a screenshot:
#   (a) onboarding wrote the profile but the read came back empty, so app/index.tsx hit its
#       `if (!localUserProfile || !taxProfile) return <Redirect href="/onboarding" />` and bounced
#       straight back here — in which case "Welcome" is on screen and THIS line fails first.
#   (b) the dashboard mounted but rendered nothing — "Welcome" is gone and the next line fails.
# "Your earnings" is the first text in ListHeaderComponent (DashboardScreen.tsx:183), so it is not
# a scroll problem either way.
# 📸 Screenshot FIRST and unconditionally — the assertions below end the flow when they
# fail, and this frame is what actually answers the question. Written under
# apps/mobile/.maestro/, which the workflow already archives as an artifact.
- takeScreenshot: .maestro/diag-01-after-continue
- assertNotVisible: "Welcome"
# If the dashboard threw, ErrorBoundary is on screen and renders error.message right below
# this title — so this failing both names the cause AND puts the real message in the shot.
- assertNotVisible: "Something went wrong"
# ⛔ `extendedWaitUntil`, not `assertVisible`. Run 36085067554 failed here on a hierarchy that
# SHOWS "Your earnings" on screen at [20,85][227,123] — element present + assertion failed means the
# app had not finished its first render inside the default timeout, on a runner whose speed varies
# about 4.5× between dispatches. ⚡ **This is the same fix already applied twice in this suite** for
# the identical symptom (`clear-all-data.yaml` and `demo-mode.yaml`, both citing run 35902276697),
# and it belongs here most of all: **every other flow runs this one as its precondition**, so one
# slow render fails whichever flow happens to draw it — which is what made the flakiness look random
# and produced the "1 in 6" figure. ⚠️ The two `assertNotVisible` lines above stay as they are: they
# are diagnostics that must fail FAST to say which hypothesis held.
- extendedWaitUntil:
    visible: "Your earnings"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

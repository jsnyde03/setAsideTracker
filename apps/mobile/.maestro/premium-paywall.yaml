# Premium paywall smoke (native). Verifies the paywall is reachable from Settings and shows the
# Apple-required elements (price, auto-renewal disclosure, Terms/Privacy links, restore, subscribe).
# The actual sandbox purchase → unlock → restore loop needs a StoreKit sandbox account and Apple's
# purchase sheet, which can't be driven reliably here — that's a manual TestFlight pass.
appId: com.gigtaxtracker.app
name: Premium Paywall (smoke)
---
- launchApp:
    clearState: true
- assertVisible: "Welcome"
- tapOn: "Your name"
- inputText: "Maestro Tester"
- tapOn: "Single"
# ⚠️ hideKeyboard BEFORE reaching for the state field, not after. The field sits at y≈543 on
# an 874-tall screen and the keyboard covers roughly the bottom third, so a blind tap lands on
# the KEYBOARD: focus never leaves the name field and the next inputText appends there.
# Proven, not guessed — dispatch #6's view hierarchy showed the name field holding
# "Maestro Tester TX", the state field empty, and a native "State required" alert on screen.
# That is why every flow "failed to reach the dashboard": onboarding was never valid.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "State you primarily work in"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: "e.g. CA"
- inputText: "TX"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "I understand this app provides estimates, not tax advice"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: "I understand this app provides estimates, not tax advice"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: "Continue"
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
# Open Settings → the premium upsell row → the paywall.
- tapOn: "Settings"
- assertVisible: "Upgrade to Premium"
- tapOn: "Upgrade to Premium"
- assertVisible: "SetAside Premium"
- assertVisible: "Subscribe"
- assertVisible: "Restore purchases"
- assertVisible: "Terms of Use (EULA)"
- assertVisible: "Privacy Policy"
- assertVisible: "automatically renews"

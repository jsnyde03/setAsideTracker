# ⛔ TEMPORARY PROBE (1.2.16) — DELETE once it has answered. It fails ON PURPOSE.
#
# The question: after typing a state code, a NUMERIC keypad is on screen. The only numeric input on
# that screen is `Dependents`, and nothing taps it. If focus really does move there, then a real
# user typing their state gets the wrong keyboard — an app bug, not a test one.
#
# The web probe (Playwright, 2026-09-23) already ruled out a platform-independent cause: on
# react-native-web focus STAYS on the state field through the exact-code match that fires
# onChange. But RN-web is not RN, so it cannot settle what the native keyboard does.
#
# Maestro dumps the view hierarchy ONLY on a failing step, and that dump is the only thing that
# reports which node holds focus. So this flow walks onboarding to the exact moment in question and
# then asserts something that cannot exist, purely to force the dump.
appId: com.gigtaxtracker.app
name: ZZ focus probe (deliberate failure, forces a hierarchy dump)
---
- launchApp:
    clearState: true
- assertVisible: "Welcome"
- tapOn: "Your name"
- inputText: "Maestro Tester"
- tapOn: "Single"
- tapOn: "Tax profile.*"
- scrollUntilVisible:
    element:
      text: "State you primarily work in"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "e.g. CA"
- inputText: "TX"
# Proves we are in the state this probe is about: the chip only appears once the field holds TX.
- assertVisible: "Texas"
# ⛔ THE POINT OF THE FLOW. This string cannot match anything, so the step fails and the workflow
# prints the hierarchy — including the FOCUS section and every attribute key the tree carries.
- assertVisible: "ZZ-PROBE-FORCE-A-DUMP-THIS-CANNOT-MATCH"

# Log an entry, then delete it. Covers two native-only paths: the DateField native picker (left at
# its default of today) and the destructive "Delete entry?" Alert confirmation dialog — neither of
# which the web Playwright suite can exercise.
appId: com.gigtaxtracker.app
name: Log + delete entry (native picker + confirm dialog)
---
# Precondition: a fresh onboarded session on the dashboard.
- runFlow: onboarding.yaml

# --- Log a DoorDash entry ---
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
# Fields are addressed by their accessible NAME. Before 1.2.0.8 `TextField` never labelled its input,
# so the only handle was the placeholder plus an index — which broke the moment a router kept the
# previous screen in the hierarchy behind this one, since the dashboard's set-aside field shares the
# "0.00" placeholder.
- tapOn: "Gross pay"
- inputText: "120"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
- tapOn: "Save Entry"
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
- assertVisible:
    text: "Edit DoorDash entry.*"

# --- Delete it, confirming the native destructive Alert ---
- tapOn:
    text: "Edit DoorDash entry.*"
- assertVisible: "Edit Entry"
- tapOn: "Delete entry"
- assertVisible: "Delete entry?"
- tapOn: "Delete"
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
- assertNotVisible:
    text: "Edit DoorDash entry.*"

# The safe-harbor / Form 2210 calculator is Premium. It surfaces on the dashboard as an "Avoid the
# IRS penalty · Premium" card whenever there's gig tax to set aside (no W2 job required, unlike the
# W-4 card). Like the W-4 card it navigates a free user straight to the paywall (no native Alert),
# but the hop is still worth exercising on a real simulator. The safe-harbor math is covered by the
# computeSafeHarbor unit tests.
appId: com.gigtaxtracker.app
name: Safe-harbor gating (locked card → paywall)
---
- launchApp:
    clearState: true
- assertVisible: "Welcome"
- tapOn: "Your name"
- inputText: "Maestro Tester"
- tapOn: "Single"
# ⚠️ hideKeyboard BEFORE reaching for the state field, not after. The field sits at y≈543 on
# an 874-tall screen and the keyboard covers roughly the bottom third, so a blind tap lands on
# the KEYBOARD: focus never leaves the name field and the next inputText appends there.
# Proven, not guessed — dispatch #6's view hierarchy showed the name field holding
# "Maestro Tester TX", the state field empty, and a native "State required" alert on screen.
# That is why every flow "failed to reach the dashboard": onboarding was never valid.
# ⛔ NOT hideKeyboard. It is the least reliable primitive in this suite -- it took out 10 of
# 12 flows on run 35818419992 -- and when it silently under-delivers here the keyboard still
# covers the state field, the next tap lands on the KEYBOARD, and "TX" is never typed. That
# surfaces ten steps later as "Your earnings is not visible", which is why it read as random
# flakiness. Tapping a non-interactive label works for either keyboard
# (keyboardShouldPersistTaps="handled") and is what every other dismissal here already uses.
- tapOn: "Tax profile.*"
- scrollUntilVisible:
    element:
      text: "State you primarily work in"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "e.g. CA"
- inputText: "TX"
# ⚡ FAIL AT THE MIS-TYPE, not ten steps downstream. The "Texas" chip appears only once the
# field really holds TX, so this turns a silent lost keystroke into a failure that names itself.
- assertVisible: "Texas"
# ⛔ NOT hideKeyboard: a NUMERIC keypad is up once "TX" is entered, and it has no Done key.
# See onboarding.yaml for the evidence and the open question about why.
- tapOn: "Tax profile.*"
- scrollUntilVisible:
    element:
      text: "I understand this app provides estimates, not tax advice"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "I understand this app provides estimates, not tax advice"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Continue"
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

# Log gig income so there's tax to set aside (and the safe-harbor card appears).
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
- tapOn: "Gross pay"
- inputText: "4000"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
# ⛔ 1.2.14.4: below the fold since 1.2.5 added the GPS trip toggle — see clear-all-data.yaml.
- scrollUntilVisible:
    element:
      text: "Save Entry"
    direction: DOWN
# 1.2.14.5, corrected by run 3: dismiss the keypad after the scroll, but NEVER by coordinate.
# ⛔ A coordinate is not a neutral point, it is whatever the layout puts there. "50%,15%" = y~131,
# and once the keypad closes and the form reflows that is INSIDE the Date field [20,96][382,141] --
# so the dismissal tap opened the native date picker, which covered Save Entry and turned a working
# scroll into "Element not found". Addressing a non-interactive label BY NAME cannot drift when the
# layout moves, which is the whole failure mode 1.2.5 introduced here.
- tapOn: "Measures your miles while a trip is running.*"
- takeScreenshot: .maestro/diag-before-save
- tapOn: "Save Entry"
- takeScreenshot: .maestro/diag-after-save
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"

# The safe-harbor card is present but locked behind Premium; tapping it opens the paywall directly.
- scrollUntilVisible:
    element:
      text: "Avoid the IRS penalty.*Premium.*"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    text: "Avoid the IRS penalty.*Premium.*"
- assertVisible: "SetAside Premium"
- tapOn: "Close"

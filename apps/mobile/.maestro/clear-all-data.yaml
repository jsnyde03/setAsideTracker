# Clear all data — a destructive, native-Alert-confirmed path with NO automated coverage until now.
#
# Why it needs Maestro specifically: `Alert.alert` doesn't render under react-native-web, so the
# Playwright suite cannot reach this at all. It went through the 1.2.0.3 rewiring (it now runs through
# AppDataProvider) and the 1.2.0.4 routing migration (it now `replace`s to /onboarding rather than
# setting a screen) with nothing exercising it in either.
#
# It is also one of two data-loss paths in the app. If the confirm dialog stops confirming, or the
# post-clear navigation lands somewhere with a stale profile still in memory, this is where it shows.
appId: com.gigtaxtracker.app
name: Clear all data (destructive confirm + return to onboarding)
---
# Precondition: a fresh onboarded session on the dashboard.
- runFlow: onboarding.yaml

# Log an entry so there is something real to destroy — clearing an empty app proves much less.
- tapOn: "Log Earnings"
- assertVisible: "Platform"
- tapOn: "DoorDash"
- tapOn: "Gross pay"
- inputText: "250"
# ⚠️ NOT hideKeyboard. iOS's NUMERIC keypad has no return/Done key, so hideKeyboard fails
# outright ("Couldn't hide the keyboard") — it only works for the text keyboard, which is why
# onboarding passes and every entry-form flow did not. Worse, the keypad spans y=590-874 and so
# hides the Premium rows at y=706 and y=754, turning into a second symptom: scrollUntilVisible
# reporting "no visible element" for rows the hierarchy clearly shows are present.
# Tapping a neutral point above the keypad dismisses it (the form sets
# keyboardShouldPersistTaps="handled", so a tap outside an input blurs it).
- tapOn:
    point: "50%,15%"
# ⛔ 1.2.14.4: "Save Entry" is BELOW THE FOLD, and has been since 1.2.5 put the GPS trip toggle and
# its description on this form. The failure hierarchy showed the form at **scroll 0% of 2 pages**
# with every field filled correctly (gross pay 4000, mileage 500) — the button was never missing,
# it was off-screen, and the assertion could only say it was absent.
# ⚠️ Save Entry is the last control on the form, so it can never be centred — the case that made
# `centerElement` visibly costly before the mechanism was understood. See onboarding.yaml for why
# no flow in this suite sets it.
- scrollUntilVisible:
    element:
      text: "Save Entry"
    direction: DOWN
# 1.2.14.5, corrected by run 3: dismiss the keypad after the scroll, but NEVER by coordinate.
# ⛔ A coordinate is not a neutral point, it is whatever the layout puts there. "50%,15%" = y~131,
# and once the keypad closes and the form reflows that is INSIDE the Date field [20,96][382,141] --
# so the dismissal tap opened the native date picker, which covered Save Entry and turned a working
# scroll into "Element not found". Addressing a non-interactive label BY NAME cannot drift when the
# layout moves, which is the whole failure mode 1.2.5 introduced here.
- tapOn: "Measures your miles while a trip is running.*"
- takeScreenshot: .maestro/diag-before-save
- tapOn: "Save Entry"
- takeScreenshot: .maestro/diag-after-save
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
- scrollUntilVisible:
    element:
      text: "Edit DoorDash entry.*"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible:
    text: "Edit DoorDash entry.*"

# --- Clear it, confirming the native destructive Alert ---
# ⛔ Settings lives in the dashboard ListHeaderComponent, and the scroll above took it off screen.
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Settings"
# ⛔ "Sample data", not "Appearance" — and the change is the point. This is a "did Settings open"
# probe, and it was reading a row's POSITION rather than the screen's presence: "Appearance" sits
# mid-list, so when 1.2.8.4 added a "Replay the tour" row above it, it fell below the fold and this
# flow failed on a Settings screen that had opened perfectly.
# ⚠️ **Adding a Settings row is a TWO-SUITE change.** The Playwright helper that clicks through
# Appearance was checked before shipping the row; this flow was not, and it is the one that broke.
# "Sample data" is the FIRST section on the screen, so nothing can push it down.
- assertVisible: "Sample data"
- scrollUntilVisible:
    element: "Clear all data"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Clear all data"
- assertVisible: "Clear all data?"
# "Clear Everything" is the destructive button's exact label — verified against SettingsScreen rather
# than assumed. A wrong label here fails as "the dialog never appeared", which reads like a bug in the
# app rather than in the flow.
- tapOn: "Clear Everything"

# The app must land back on onboarding — not on a dashboard still holding the cleared profile.
# ⛔ extendedWaitUntil, not assertVisible: run 35902276697 failed here on a hierarchy that
# SHOWS "Welcome" on screen at [20,154][382,192]. Element present + assertion failed = the app
# had not finished its first render inside the default timeout, on a runner whose speed varies
# about 4.5x between dispatches. This waits instead of guessing how slow the machine is.
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 20000
- assertNotVisible: "Set aside for taxes"

# And the data must be genuinely gone, not merely navigated away from: re-onboarding lands on an
# empty dashboard with no trace of the entry logged above.
- runFlow: onboarding.yaml
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
# ⛔ ASSERT THE EMPTY STATE BY NAME, not the absence of the entry. This is the flow's whole point —
# that a destructive clear really destroyed — and an absence assertion cannot carry it: the entry
# list sits below this scroll position, so "Edit DoorDash entry" is off screen whether the data was
# cleared or is sitting right there intact. The old line would have gone green over a clear that
# did nothing. The empty state is only rendered when there is genuinely nothing left.
- scrollUntilVisible:
    element:
      text: "No entries yet.*"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "No entries yet.*"

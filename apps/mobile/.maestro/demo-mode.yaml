# Demo mode, on a real device (1.2.1).
#
# Why this flow exists when a 11-test Playwright suite already covers demo mode: the web suite runs
# on react-native-web, which has no real navigation stack, no Alert and no persistence across a
# process restart. This asserts the parts only a device can answer —
#   1. entering from onboarding survives a REAL stacked-route push/pop, not a URL change
#   2. the demo banner renders inside the real SafeAreaView, below the notch, on every screen
#   3. premium previews open real native screens (1.2.1.6)
#   4. exiting returns to onboarding with the demo gone
#
# ⚠️ Runs BEFORE clear-all-data.yaml but AFTER the gating flows: it deliberately starts from a
# fresh, NOT-yet-onboarded state, so it must not inherit an onboarded session.
appId: com.gigtaxtracker.app
name: Demo mode (enter, preview premium, exit)
---
- clearState
- launchApp

# ── 1. Enter from onboarding ────────────────────────────────────────────────────────────────────
# ⚠️ Below the fold on a shorter device — it sits BELOW "Continue" on the onboarding ScrollView,
# so it is the last thing on the screen. Scroll to it rather than assuming it is in view; asserting
# blind here is what failed this flow on 2026-09-20.
- scrollUntilVisible:
    element:
      text: "Explore with sample data"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Explore with sample data"
- tapOn: "Explore with sample data"

# 🔎 Same diagnostic: if entering the demo bounced back to onboarding, say so here
# rather than reporting a confusing "Set aside for taxes is not visible" two lines later.
- takeScreenshot: .maestro/diag-02-after-enter-demo
# ⚠️ "Welcome" is the WRONG probe here: this flow scrolls to the bottom of onboarding to reach
# the button, so "Welcome" is off-screen whether or not the demo opened, and would pass either
# way. The affordance we just tapped is the honest probe — it is in view on the screen we are
# trying to leave, so it can only be gone if we actually left.
# 🔎 Which failure is this? The two look identical from outside:
#   (a) the tap never landed — a flow problem; or
#   (b) the tap DID land, enterDemo() threw, and app/onboarding.tsx:54 caught it and showed
#       "Couldn't start the demo" — which leaves us on onboarding with the button still
#       visible, i.e. demo mode is broken ON DEVICE and the web suite cannot see it.
# Asserting the Alert FIRST makes the log say which, instead of us inferring it again.
- assertNotVisible: "Couldn't start the demo"
- assertNotVisible: "Explore with sample data"
- assertNotVisible: "Something went wrong"

# Seeded content, not just a navigation — an empty demo would satisfy "we moved" and prove nothing.
- scrollUntilVisible:
    element:
      text: "Set aside for taxes"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: "Set aside for taxes"
# ⛔ SCROLL to the entry rather than asserting it from here. "Set aside for taxes" sits at y≈328 on
# the dashboard, and the entry list is far below it -- run 35818419992 failed this assertion on a
# screen the dump shows working perfectly, seeded persona and all. Absence of an element on screen
# is not absence of the data.
- scrollUntilVisible:
    element:
      text: "Edit Uber entry.*"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible:
    text: "Edit Uber entry.*"

# ── 2. The demo is marked, on more than one screen ──────────────────────────────────────────────
# ⚠️ The ACCESSIBLE name, which is not the visible text. DemoBanner sets accessibilityLabel on the
# wrapper, and that REPLACES the child text in the accessibility tree -- so "Sample data — not your
# account" is on screen for a human and unreachable for Maestro, which only ever sees this string.
- assertVisible: "Sample data. This is an example account, not your own.*"
# ⛔ Settings lives in the dashboard ListHeaderComponent, so scrolling DOWN to the entries
# takes it off screen. Scroll back UP to it rather than tapping where it used to be.
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Settings"
- assertVisible: "Sample data. This is an example account, not your own.*"
- tapOn: "Close"

# ── 3. Premium previews open the real screens (1.2.1.6, [D5]) ───────────────────────────────────
# Web cannot prove these are native screens rather than a re-render; this can.
- scrollUntilVisible:
    element:
      text: "Open the safe-harbor calculator"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Open the safe-harbor calculator"
- assertVisible: "Safe harbor"
- assertNotVisible: "SetAside Premium"
- tapOn: "Close"

- scrollUntilVisible:
    element:
      text: "Open the expense breakdown"
    direction: DOWN
- waitForAnimationToEnd
- tapOn: "Open the expense breakdown"
- assertVisible: "Expense breakdown"
- assertNotVisible: "SetAside Premium"
- tapOn: "Close"

# ── 4. [D5]: previewing is not owning. PDF export writes a real file, so it still refuses. ───────
# This is the one assertion here that a simulator proves better than the web suite ever could: the
# export path reaches a real filesystem and a real share sheet on device.
# ⛔ Same as the first Settings tap: the header scrolls away with the list.
- scrollUntilVisible:
    element:
      text: "Settings"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Settings"
- assertNotVisible: "Premium active"
- scrollUntilVisible:
    element:
      text: "Export tax summary as PDF"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    text: "Export tax summary as PDF"
- assertVisible: "SetAside Premium"
- tapOn: "Close"

# ── 5. Exit, and the demo is gone ───────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Exit sample data"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Exit sample data"

# No real profile was ever created, so leaving lands back on onboarding with the marker gone.
# ⛔ SETTLE ON THE NEW SCREEN BEFORE SCROLLING IT. Exiting `replace`s the route, and a swipe sent
# during that transition lands on a view that is still animating in -- it moves nothing, and the
# scroll then reports "No visible element found" for a button that is merely further down an
# un-scrolled page. Run 35828767212 failed exactly here, on a dump showing onboarding mounted
# perfectly at scroll 0: the exit had worked, the scroll never happened.
# Asserting the destination first is also the honest probe -- it proves we left the demo, which
# scrolling alone never did.
- assertVisible: "Welcome"
- waitForAnimationToEnd
# ⛔ NO SCROLL HERE, and the scroll was never what this step needed. Two runs failed on it with the
# hierarchy showing the outer ScrollView at 0% — the swipe moved nothing on a freshly-replaced
# route — while "Welcome" was already on screen and asserting cleanly. Scrolling to a button at the
# bottom of onboarding proved nothing that "Welcome" above and the banner's absence below do not
# prove better: the first says we are back on onboarding, the second says the demo is really gone.
# A step that can fail without anything being wrong is worse than no step.
# ⛔ VACUOUS AS WRITTEN until 2026-09-23: this asserted the banner's VISIBLE text, which the
# wrapper's accessibilityLabel replaces in the accessibility tree. Maestro could never see that
# string, so the assertion passed whether or not demo mode had actually exited -- the one thing
# this line exists to prove. It now names the string the tree really carries.
- assertNotVisible: "Sample data. This is an example account, not your own.*"

# SetAsideTracker — iOS Maestro (native flows), ported from codemagic.yaml at 1.2.14.2 ([D27]).
#
# ⚡ **Why it moved.** Twelve native flows sat blocked since ~August for one reason: Codemagic is
# ~80% consumed and the remainder is reserved for TestFlight builds. macOS runners are **free on a
# public repo** — measured at 1.2.14.1, not taken from the docs, which contradict themselves:
# `billable.MACOS.total_ms = 0` for a real macOS run. So these flows now cost nothing, and simulator
# builds stop competing with the builds that have to reach a device.
#
# ⛔ **Almost every line below was bought with a failed run.** The comments are the asset, not the
# YAML. Do not "tidy" one away without reading why it is there.
name: iOS Maestro (native flows)

on:
  # ⚠️ **Corrected 2026-09-22 by trying it.** The claim here was that manual dispatch only works for
  # workflows on the DEFAULT branch (master is ~95 commits behind v1.2). That is true of the Actions
  # **UI button**, and it is NOT true of the API: `gh workflow run maestro-ios.yml --ref v1.2`
  # queues a run against this branch fine. The push/paths trigger below is kept anyway — it makes
  # editing this file self-testing — but the CLI is the normal way to start a run.
  workflow_dispatch:
    inputs:
      flow:
        description: "A single flow to run (e.g. onboarding.yaml). Blank runs all of .maestro."
        required: false
        default: ""
  # ⛔ The `push`/`paths` trigger that was here is REMOVED — it was a foot-gun I built and then set
  # off. It started a full ~48-minute run on every edit to this file, including a one-line comment
  # fix, and it spawned a duplicate of run 2 that had to be cancelled. It only existed to work
  # around a dispatch limitation that turned out not to apply (see the note above), so it was
  # buying nothing. Start runs with:
  #     gh workflow run maestro-ios.yml --ref v1.2
  #     gh workflow run maestro-ios.yml --ref v1.2 -f flow=demo-mode.yaml

jobs:
  maestro:
    runs-on: macos-latest
    # The native build dominates; this costs nothing on a free runner and beats a truncated run.
    # ⚠️ Raised 60 → 90 on 2026-09-23: a slow runner can spend 7 minutes just booting the simulator,
    # and the Maestro step now allows a 10-minute driver wait plus one retry on a harness failure.
    timeout-minutes: 90

    env:
      # ⚠️ REQUIRED — without it the build fails, and it did (Codemagic, first dispatch 2026-08-08).
      # This workflow deliberately carries no Apple credentials (a simulator build needs none), and
      # that is also where SENTRY_AUTH_TOKEN would come from — so sentry-cli runs with no token,
      # errors with "Auth token is required for this request", and takes the "Bundle React Native
      # code and images" phase down with it. In @sentry/react-native 7.11.0 an upload failure fails
      # the whole build and SENTRY_ALLOW_FAILURE is not honored.
      #
      # Disabling the upload is the right fix rather than adding the token: a throwaway simulator
      # binary's source maps have no business in Sentry, and it keeps a secret out of a test job.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - name: What commit is this
        # ⛔ CLAUDE.md's rule, and it cost two Codemagic cycles: a build of old code brings its own
        # old flows, so "the fix didn't work" is indistinguishable from "the fix was never in the
        # binary". Every run says what it built in its first ten lines.
        run: echo "=== Building commit $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s) ==="

      - uses: actions/setup-node@v4
        with:
          # Pinned to match codemagic.yaml. The runner ships Node 24; parity removes a variable from
          # a harness that is itself the thing under test on the first run.
          node-version: 22
          cache: npm

      - name: Install root workspace dependencies
        # ⚠️ This is an npm WORKSPACE — everything hoists to the repo root and apps/mobile/node_modules
        # is empty. Install from the root or nothing resolves.
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build the tax-engine package
        run: npm run build --workspace services/tax-engine

      - name: Typecheck + unit test (fail fast before the slow native build)
        # Cheap gates before a ~15-minute xcodebuild. A type error found here costs seconds.
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Generate the native iOS project (expo prebuild)
        # expo prebuild runs `pod install` itself on macOS, so no separate pod step is needed.
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build the app for the iOS Simulator
        # Release embeds the JS bundle, so no Metro at run time.
        #
        # ⛔ AD-HOC SIGNED, DELIBERATELY — this is the single most expensive lesson in this file.
        # It previously used CODE_SIGNING_ALLOWED=NO on the reasoning that "simulator builds don't
        # need signing": true for launching, FALSE for the Keychain. An unsigned app carries no
        # entitlements at all, including application-identifier, which iOS requires for any Keychain
        # access. expo-secure-store goes straight to the Keychain, so every run failed with
        #
        #     Couldn't save your info / Calling the 'getValueWithKeyAsync' function has failed
        #
        # getOrCreateEncryptionKey could not read or mint a key, so NOTHING persisted, so onboarding
        # could never complete and no flow could ever reach the dashboard. The app was never broken —
        # we were testing a build structurally incapable of saving.
        #
        # ⚠️ SENTRY_DISABLE_AUTO_UPLOAD is ALSO passed as a build setting, not left to `env:` alone.
        # On Codemagic 2026-09-21 the bundle phase received it EMPTY and ran sentry-cli anyway,
        # failing the build. Rather than theorise about env inheritance, use the channel that
        # demonstrably reaches the script phase — the same one CONFIGURATION and friends arrive on.
        working-directory: apps/mobile
        run: |
          echo "SENTRY_DISABLE_AUTO_UPLOAD (env) = [${SENTRY_DISABLE_AUTO_UPLOAD}]"
          xcodebuild \
            -workspace ios/SetAsideTracker.xcworkspace \
            -scheme SetAsideTracker \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            SENTRY_DISABLE_AUTO_UPLOAD=true \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Boot a simulator and install the app
        # ⚠️ Do NOT hardcode a simulator name. The runner's Xcode image decides which devices exist,
        # and "iPhone 15" was absent from Xcode 26.4 — which cost a whole mac build on 2026-09-20.
        # It is absent from this image too (Xcode 26.6 ships iPhone 17 / Air / 16e / 17e, confirmed
        # at 1.2.14.1), so the derivation is not paranoia, it is load-bearing.
        #
        # ⛔ The old line was `xcrun simctl boot "iPhone 15" || true`, and the `|| true` is what made
        # it expensive rather than obvious: the boot failure was swallowed, then `simctl install`
        # died two lines later with "No devices are booted" — a missing-device problem presenting as
        # an install problem. Nothing is swallowed here.
        run: |
          set -euo pipefail

          # Whatever iPhone this image actually has. Maestro does not care which model, only that one
          # is booted. simctl groups by runtime ascending, so `tail -1` is the newest. The sed
          # tolerates a model name carrying its own parentheses, e.g. "iPhone SE (3rd generation)".
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | tail -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')

          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator is available on this runner. Devices present:"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting: $(xcrun simctl list devices available | grep "$DEVICE_ID" | sed 's/^[[:space:]]*//')"

          # Tolerate ONLY the already-booted case, and prove it by reading the device's actual state.
          if ! xcrun simctl boot "$DEVICE_ID"; then
            if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "(Booted)"; then
              echo "Device was already booted — continuing."
            else
              echo "Boot failed and the device is not booted. Aborting rather than masking it."
              exit 1
            fi
          fi

          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" \
            ios/build/Build/Products/Release-iphonesimulator/SetAsideTracker.app

          # ⚠️ Shell variables do NOT cross step boundaries. The Maestro step needs this UDID to
          # restart a wedged simulator, so it goes through GITHUB_ENV or it arrives empty there.
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
        working-directory: apps/mobile

      - name: Cache the Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-v1

      - name: Install Maestro
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version

      - name: Run Maestro native flows
        # ⚡ THE MOST USEFUL THING IN THIS FILE. Five dispatches on 2026-09-20 were spent narrowing a
        # failure by inference, because the run reported only which assertion failed and never what
        # was on screen. An assertion says what was ABSENT; the view hierarchy says what was PRESENT,
        # and it cracked the two hardest failures on its first run each.
        #
        # ⛔ Do not diagnose from assertion text. Read the dump.
        working-directory: apps/mobile
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"

          TARGET=".maestro"
          if [ -n "${{ github.event.inputs.flow }}" ]; then
            TARGET=".maestro/${{ github.event.inputs.flow }}"
            echo "Running a single flow: $TARGET"
          fi

          # ⛔ The XCUITest runner is installed and launched on FIRST USE, and on a SLOW runner that
          # does not fit in Maestro's 15s default. ⚠️ Runner speed varies ~4.5x between dispatches
          # and it is the whole story here -- measured on the `simctl bootstatus` wait, which is the
          # same work every run: 1m36s on 35810608829 (flows ran) vs 7m13s on 35815572229 (the
          # driver never came up). 240000 was already applied on that second one and was not enough.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=600000

          run_maestro() {
            # ⚠️ PIPESTATUS[0], never $? -- a pipeline reports the LAST command's status, so `$?`
            # here would be tee's 0 and every failure would read as a pass.
            maestro test "$TARGET" 2>&1 | tee /tmp/maestro-output.txt
            return ${PIPESTATUS[0]}
          }

          # A harness failure executes NO flow, so there is nothing to re-read and nothing to think
          # about -- the only useful response is to run it again on a fresh driver. Doing that here
          # costs minutes; doing it by hand costs a whole 35-minute build, and two consecutive
          # dispatches were already spent that way for zero information.
          flows_ran() { grep -qE '\[(Passed|Failed)\]' /tmp/maestro-output.txt; }

          MAESTRO_EXIT=0
          run_maestro || MAESTRO_EXIT=$?

          if [ "$MAESTRO_EXIT" -ne 0 ] && ! flows_ran; then
            echo ""
            echo "=== NO FLOW RAN -- harness failure. Restarting the driver and retrying once. ==="
            grep -iE 'driver not ready|IOSDriverTimeout|Unable to launch' /tmp/maestro-output.txt \
              | head -3 || true
            # ⚠️ Addressed by UDID (exported from the boot step), never `booted` -- if the shutdown
            # succeeds there is no longer a device named `booted` to bring back up.
            if [ -n "$DEVICE_ID" ]; then
              xcrun simctl shutdown "$DEVICE_ID" || true
              xcrun simctl boot "$DEVICE_ID" || true
              xcrun simctl bootstatus "$DEVICE_ID" -b || true
            else
              echo "(DEVICE_ID not set -- retrying against the existing simulator)"
            fi
            MAESTRO_EXIT=0
            run_maestro || MAESTRO_EXIT=$?
          fi

          # ⛔ "Failed" is not one outcome, it is two, and they mean opposite things. A HARNESS
          # failure executes no flow at all and says NOTHING about the app or about any fix under
          # test -- read it as a result and you will "verify" something that never ran. Two runs
          # were misread that way before this banner existed.
          if [ "$MAESTRO_EXIT" -ne 0 ] && ! flows_ran; then
            echo ""
            echo "################################################################"
            echo "## NO FLOW RAN, TWICE. This is a HARNESS failure, not a result.##"
            echo "## Nothing here confirms or refutes any change under test.     ##"
            echo "## Do not draw a conclusion about the app.                     ##"
            echo "################################################################"
            echo ""
            grep -iE 'driver not ready|IOSDriverTimeout|Unable to launch|simulator' /tmp/maestro-output.txt \
              | head -5 || true
          fi

          if [ "$MAESTRO_EXIT" -ne 0 ]; then
            echo "=== Flows failed. Capturing the simulator's final frame. ==="
            xcrun simctl io booted screenshot .maestro/diag-final-screen.png \
              || echo "(could not capture the simulator screen)"

            cat > /tmp/dump_hierarchy.py <<'PYEOF'
          import json, sys

          def walk(node, out):
              attrs = node.get("attributes") or {}
              shown = [attrs.get(k) for k in ("accessibilityText", "text", "hintText", "value")]
              shown = [str(v) for v in shown if v]
              if shown:
                  label = " | ".join(dict.fromkeys(shown))
                  out.append("    %-62s %s" % (label[:62], attrs.get("bounds", "")))
              for child in (node.get("children") or []):
                  walk(child, out)

          out = []
          walk(json.load(open(sys.argv[1], encoding="utf-8")), out)
          if not out:
              out = ["    (no text nodes)"]
          for line in out[:150]:
              print(line)
          PYEOF

            echo "=== ON-SCREEN TEXT AT EACH FAILURE (from Maestro's view hierarchy) ==="
            find "$HOME/.maestro/tests" -type f -name '*.json' -path '*screen-hierarchy*' 2>/dev/null \
              | head -12 | while read -r h; do
                  echo ""
                  echo "--- $(basename "$(dirname "$(dirname "$h")")") / $(basename "$h") ---"
                  python3 /tmp/dump_hierarchy.py "$h" 2>&1 | head -45
                done

            echo ""
            echo "=== All per-failure artifacts ==="
            find "$HOME/.maestro/tests" -type f \( -name '*.png' -o -name '*.json' \) 2>/dev/null \
              | tail -40 || echo "(none found)"
          fi

          exit $MAESTRO_EXIT

      - name: Collect artifacts into the workspace
        # ⚠️ `actions/upload-artifact` does NOT expand `~` or `$HOME` in `path:` — Codemagic did, and
        # porting its `$HOME/.maestro/tests/**` line verbatim would have uploaded nothing, silently,
        # exactly on the runs where the evidence matters. Copy into the workspace first and upload a
        # relative path.
        if: always()
        run: |
          mkdir -p maestro-artifacts
          cp -R "$HOME/.maestro/tests" maestro-artifacts/tests 2>/dev/null || echo "(no per-failure tests dir)"
          cp -R apps/mobile/.maestro/*.png maestro-artifacts/ 2>/dev/null || echo "(no screenshots)"
          echo "collected:"
          find maestro-artifacts -type f | head -20
          echo "total files: $(find maestro-artifacts -type f | wc -l)"

      - name: Upload Maestro artifacts
        # `always()` — the artifacts matter precisely when the step above failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: maestro-artifacts/
          if-no-files-found: ignore
          retention-days: 14
